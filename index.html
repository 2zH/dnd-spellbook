<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法术书 · 空间流动版</title><style>:root{color-scheme:light;--foreground:#302d29;--muted-foreground:#807a72}body{max-width:760px;margin:auto!important;padding:0 16px;background:#fff!important}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{font:12px/1.5 var(--font-sans,system-ui,sans-serif);color:var(--foreground,#302d29)}button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px}header strong{font-weight:500;letter-spacing:.12em}header span{font-size:11px;color:var(--muted-foreground,#807a72)}.scene{position:relative;isolation:isolate;width:100%;height:600px;overflow:hidden;background:#f1f0ec;--d:38px;--fz:12px}.cross{position:absolute;width:9px;height:9px;z-index:500;pointer-events:none}.cross:before,.cross:after{content:'';position:absolute;background:#df7844}.cross:before{width:9px;height:1px;top:4px}.cross:after{width:1px;height:9px;left:4px}.tl{top:14px;left:14px}.tr{top:14px;right:14px}.bl{bottom:14px;left:14px}.br{bottom:14px;right:14px}
.spell{position:absolute;left:0;top:0;display:flex;align-items:center;gap:calc(6px * var(--labelScale,1));width:max-content;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer;will-change:transform,opacity;outline:none;transform-origin:0 0}.disc{display:grid;place-items:center;flex:none;width:var(--d);height:var(--d);border-radius:50%;background:white;border:1px solid #e8e5df;box-shadow:0 2px 4px #3527190a;transition:box-shadow .2s,border-color .2s}.disc img{width:55%;height:55%;object-fit:contain;pointer-events:none}.name{font-size:calc(var(--fz) * var(--labelScale,1));font-family:'Songti SC','Noto Serif SC',serif;letter-spacing:.035em;color:#51493f;text-shadow:0 1px 2px #f1f0ec,0 0 4px #f1f0ec}.spell:hover .disc,.spell:focus-visible .disc{border-color:#bc9470;box-shadow:0 3px 10px #744a2320}.spell:focus-visible .name{text-decoration:underline;text-underline-offset:3px}
.book{position:absolute;left:50%;top:50%;width:44%;transform:translate(-50%,-50%) perspective(900px) rotateX(12deg) rotateZ(-5deg);border:0;background:none;padding:0;cursor:pointer;z-index:200;outline:none}.book{perspective:900px}.engraving{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:multiply;transition:transform .4s}.book:hover .engraving,.book:focus-visible .engraving{transform:translateY(-4px) rotate(-1deg)}.book img{width:100%;display:block;pointer-events:none;filter:drop-shadow(0 11px 11px #48322124);transition:transform .4s,filter .4s}.book:hover img,.book:focus-visible img{transform:translateY(-4px) rotate(-1deg);filter:drop-shadow(0 15px 14px #48322130)}.book:focus-visible{outline:1px solid #b5906b;outline-offset:8px;border-radius:14px}.ripple{position:absolute;left:50%;top:50%;width:70px;height:38px;border:1px solid #b59a6b;border-radius:50%;pointer-events:none;opacity:0;z-index:95;transform:translate(-50%,-50%)}.ripple.hit{animation:ink .65s ease-out}@keyframes ink{0%{opacity:.7;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.8)}}
.controls{display:flex;gap:14px;align-items:center;flex:none}.controls button{background:none;border:0;border-bottom:1px solid transparent;padding:3px 0;cursor:pointer;font-size:11px;color:var(--muted-foreground,#807a72)}.controls button:hover{border-bottom-color:currentColor}.count{font-variant-numeric:tabular-nums;color:var(--muted-foreground,#807a72);font-size:11px}.count b{font-size:15px;font-weight:500;color:var(--foreground,#302d29)}.hint{font-size:11px;color:var(--muted-foreground,#807a72);min-height:35px;padding:0 2px 8px}.scene[data-narrow=true] .name{letter-spacing:0}footer{flex-wrap:wrap} @media(prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition:none!important}}
.scene{cursor:grab;touch-action:none;user-select:none}.scene.dragging,.scene.dragging .spell,.scene.dragging .book{cursor:grabbing}.controls{gap:12px;flex-wrap:wrap}.spell:focus-visible{outline:1px solid #b5906b;outline-offset:3px}</style></head><body><header><strong>法术书</strong><span>点选法术，收入书页</span></header><main class="scene" id="scene"><i class="cross tl"></i><i class="cross tr"></i><i class="cross bl"></i><i class="cross br"></i><button class="spell" data-i="0" aria-label="准备火焰箭"><span class="disc"><img src="./spell-icons/A2.png" alt=""></span><span class="name">火焰箭</span></button>
<button class="spell" data-i="1" aria-label="准备魔法伎俩"><span class="disc"><img src="./spell-icons/E9.png" alt=""></span><span class="name">魔法伎俩</span></button>
<button class="spell" data-i="2" aria-label="准备电爪"><span class="disc"><img src="./spell-icons/A4.png" alt=""></span><span class="name">电爪</span></button>
<button class="spell" data-i="3" aria-label="准备魔法飞弹"><span class="disc"><img src="./spell-icons/B2.png" alt=""></span><span class="name">魔法飞弹</span></button>
<button class="spell" data-i="4" aria-label="准备护盾术"><span class="disc"><img src="./spell-icons/B1.png" alt=""></span><span class="name">护盾术</span></button>
<button class="spell" data-i="5" aria-label="准备魅惑人类"><span class="disc"><img src="./spell-icons/B7.png" alt=""></span><span class="name">魅惑人类</span></button>
<button class="spell" data-i="6" aria-label="准备油腻术"><span class="disc"><img src="./spell-icons/B6.png" alt=""></span><span class="name">油腻术</span></button>

<button class="spell" data-i="8" aria-label="准备燃烧之手"><span class="disc"><img src="./spell-icons/F8.png" alt=""></span><span class="name">燃烧之手</span></button>
<button class="spell" data-i="9" aria-label="准备冰刃"><span class="disc"><img src="./spell-icons/A6.png" alt=""></span><span class="name">冰刃</span></button>
<button class="spell" data-i="10" aria-label="准备灼热射线"><span class="disc"><img src="./spell-icons/A5.png" alt=""></span><span class="name">灼热射线</span></button>
<button class="spell" data-i="11" aria-label="准备镜影术"><span class="disc"><img src="./spell-icons/B3.png" alt=""></span><span class="name">镜影术</span></button>
<button class="spell" data-i="12" aria-label="准备迷踪步"><span class="disc"><img src="./spell-icons/C6.png" alt=""></span><span class="name">迷踪步</span></button>
<button class="spell" data-i="13" aria-label="准备隐形术"><span class="disc"><img src="./spell-icons/C7.png" alt=""></span><span class="name">隐形术</span></button>
<button class="spell" data-i="14" aria-label="准备火球术"><span class="disc"><img src="./spell-icons/F1.png" alt=""></span><span class="name">火球术</span></button>
<button class="spell" data-i="15" aria-label="准备反制法术"><span class="disc"><img src="./spell-icons/B9.png" alt=""></span><span class="name">反制法术</span></button>
<button class="spell" data-i="16" aria-label="准备闪电束"><span class="disc"><img src="./spell-icons/F2.png" alt=""></span><span class="name">闪电束</span></button>
<button class="spell" data-i="17" aria-label="准备飞行术"><span class="disc"><img src="./spell-icons/C1.png" alt=""></span><span class="name">飞行术</span></button>
<button class="spell" data-i="18" aria-label="准备加速术"><span class="disc"><img src="./spell-icons/C2.png" alt=""></span><span class="name">加速术</span></button>
<button class="spell" data-i="19" aria-label="准备死云术"><span class="disc"><img src="./spell-icons/B5.png" alt=""></span><span class="name">死云术</span></button>
<button class="spell" data-i="20" aria-label="准备真知术"><span class="disc"><img src="./spell-icons/A9.png" alt=""></span><span class="name">真知术</span></button>
<button class="spell" data-i="21" aria-label="准备传送术"><span class="disc"><img src="./spell-icons/C5.png" alt=""></span><span class="name">传送术</span></button>
<button class="spell" data-i="22" aria-label="准备祈愿术"><span class="disc"><img src="./spell-icons/C4.png" alt=""></span><span class="name">祈愿术</span></button>
<button class="spell" data-i="23" aria-label="准备时间停止"><span class="disc"><img src="./spell-icons/C3.png" alt=""></span><span class="name">时间停止</span></button><button class="book" id="book" aria-label="收起全部法术"><img src="./spellbook-book.png" alt="摊开的皮革法术书，带金属包角、缝线书脊与红色书签"><svg class="engraving" viewBox="0 0 1504 959" aria-hidden="true"><g stroke="#76552c" fill="none" opacity=".55"><g transform="translate(365 390) rotate(4)"><circle r="152" stroke-width="2"/><circle r="137" stroke-width="1"/><circle r="94" stroke-width="1.4"/><path d="M0 -125 108 62 -108 62Z M0 125 -108 -62 108 -62Z" stroke-width="2"/><circle r="23" stroke-width="2"/><path d="M0 -167v-24M0 167v24M-167 0h-24M167 0h24" stroke-width="2"/><path d="M0 -145v6" transform="rotate(0)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(15)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(30)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(45)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(60)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(75)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(90)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(105)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(120)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(135)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(150)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(165)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(180)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(195)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(210)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(225)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(240)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(255)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(270)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(285)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(300)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(315)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(330)" stroke-width="2"/><path d="M0 -145v6" transform="rotate(345)" stroke-width="2"/></g><g transform="translate(865 185) rotate(-3)"><path d="M0 32H390M0 38H390" stroke-width="1.4"/><path d="M20 120q17 -16 29 0t30 0t35 0m12 0q14 -17 24 0t40 0t50 0t35 0M20 162q20 -17 40 0t24 0t35 0t54 0t40 0m20 0h50M20 204q10 -12 25 0t45 0t32 0t20 0t40 0t50 0t45 0M20 246q20 -14 40 0t40 0t35 0t38 0M20 340q20 -17 40 0t24 0t35 0t54 0t40 0m20 0h50M20 382q10 -12 25 0t45 0t32 0t20 0t40 0t50 0t45 0M20 424q20 -14 40 0t40 0t35 0t38 0" stroke-width="2"/><path d="M90 505h180M110 514h140" stroke-width="1.5"/></g></g></svg></button><i class="ripple" id="ripple"></i></main><footer><span class="count"><b id="count">0</b> / 24 已准备</span><div class="controls"><button id="pause" aria-pressed="false">暂停环绕</button><button id="fold">收拢视野</button><button id="reset">全部归位</button></div></footer><div class="hint" id="hint" aria-live="polite">点书收起全部法术 · 再点一次散开</div><script>
const names=["火焰箭","魔法伎俩","电爪","魔法飞弹","护盾术","魅惑人类","油腻术","疗伤术","燃烧之手","冰刃","灼热射线","镜影术","迷踪步","隐形术","火球术","反制法术","闪电束","飞行术","加速术","死云术","真知术","传送术","祈愿术","时间停止"];
const scene=document.getElementById('scene'),book=document.getElementById('book'),count=document.getElementById('count'),hint=document.getElementById('hint'),pause=document.getElementById('pause'),foldButton=document.getElementById('fold');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,clock=0,last=0,paused=reduced,yaw=.35,pitch=-.14,zoom=reduced?1:.06,zoomTarget=1,velocityX=0,velocityY=0,drag=null,suppressUntil=0,generation=0;const timers=new Set();
const spells=[...document.querySelectorAll('.spell')].map((el,i)=>{const yy=1-2*(i+.5)/24,rad=Math.sqrt(1-yy*yy),theta=i*Math.PI*(3-Math.sqrt(5));return{el,i,p:[Math.cos(theta)*rad,yy,Math.sin(theta)*rad],x:0,y:0,scale:1,z:0,prepared:false,anim:null,w:0,h:0};});
function layout(){W=scene.clientWidth;H=Math.round(Math.max(410,Math.min(680,W*1.02)));scene.style.height=H+'px';scene.dataset.narrow=W<450;scene.style.setProperty('--d',Math.max(16,Math.min(28,W*.044))+'px');scene.style.setProperty('--fz',Math.max(10.5,Math.min(12,W*.021))+'px');spells.forEach(d=>{d.w=d.el.offsetWidth;d.h=d.el.offsetHeight;});paint();}
function softDepth(z){const t=Math.max(0,Math.min(1,(z+.4)/.85));return t*t*(3-2*t);}
function project(d){const [x,y,z]=d.p,cy=Math.cos(yaw),sy=Math.sin(yaw),cx=Math.cos(pitch),sx=Math.sin(pitch);const xx=x*cy+z*sy,zz=-x*sy+z*cy,yy=y*cx-zz*sx,depth=y*sx+zz*cx;const camera=1.55,p=camera/(camera-depth);const radius=Math.min(W,H)*.49;return{x:W/2+xx*radius*p*zoom,y:H/2+yy*radius*p*zoom,scale:(.7+1.9*softDepth(depth))*zoom,z:depth};}
function transform(d){return 'translate3d('+(d.x-d.h*d.scale/2).toFixed(2)+'px,'+(d.y-d.h*d.scale/2).toFixed(2)+'px,0) scale('+d.scale.toFixed(4)+')';}
function paint(){spells.forEach(d=>{if(d.prepared)return;Object.assign(d,project(d));d.el.style.setProperty('--labelScale',Math.min(1.22,Math.max(.82,d.scale))/Math.max(.01,d.scale));d.el.style.transform=transform(d);d.el.style.zIndex=String(Math.round(200+d.z*90));d.el.style.opacity=String(.83+.17*(d.z+1)/2);});}
function advance(dt){if(!paused)clock+=dt;if(!paused&&!drag){yaw+=(.275+velocityX)*dt;pitch+=velocityY*dt;velocityX*=Math.exp(-dt*2.5);velocityY*=Math.exp(-dt*2.5);}zoom+=(zoomTarget-zoom)*(1-Math.exp(-dt*5));if(Math.abs(zoom-zoomTarget)<.0005)zoom=zoomTarget;paint();}
function tick(ms){if(last)advance(Math.min(.04,(ms-last)/1000));last=ms;requestAnimationFrame(tick);}
function hintDefault(){hint.textContent='拖动旋转 · 点法术收入书页 · 点书全收 / 散开';}
function update(){const n=spells.filter(d=>d.prepared).length;count.textContent=n;book.setAttribute('aria-label',n===24?'散开全部法术':'收起全部法术');}
function prepare(d){if(d.prepared||performance.now()<suppressUntil)return;d.prepared=true;d.el.disabled=true;update();const from=transform(d),to='translate3d('+(W/2-d.w*.035)+'px,'+(H/2-d.h*.035)+'px,0) scale(.07)';if(reduced){d.el.style.visibility='hidden';return;}d.anim=d.el.animate([{transform:from,opacity:1},{transform:to,opacity:0}],{duration:680,easing:'cubic-bezier(.45,0,.25,1)',fill:'forwards'});d.anim.onfinish=()=>{d.el.style.visibility='hidden';d.anim.cancel();d.anim=null;};hint.textContent=spells.every(s=>s.prepared)?'全部收入书页 · 点书让法术散开':names[d.i]+'已收入书页';}
function release(){generation++;timers.forEach(clearTimeout);timers.clear();spells.forEach(d=>{d.anim?.cancel();d.anim=null;d.prepared=false;d.el.disabled=false;d.el.style.visibility='';});zoom=reduced?1:.08;zoomTarget=1;foldButton.textContent='收拢视野';paint();update();hintDefault();}
spells.forEach(d=>{d.el.addEventListener('pointerenter',()=>{if(!drag&&!d.prepared)hint.textContent=names[d.i]+' · 点击收入书页';});d.el.addEventListener('pointerleave',()=>{if(!drag)hintDefault();});d.el.addEventListener('click',()=>prepare(d));});
book.addEventListener('click',()=>{if(performance.now()<suppressUntil)return;if(timers.size){release();return;}const pending=spells.filter(d=>!d.prepared);if(!pending.length){release();return;}const gen=++generation;pending.forEach((d,k)=>{const id=setTimeout(()=>{timers.delete(id);if(gen===generation)prepare(d);},k*35);timers.add(id);});});
scene.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false,time:e.timeStamp};velocityX=velocityY=0;});
scene.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.lastX,dy=e.clientY-drag.lastY,dt=Math.max(.008,(e.timeStamp-drag.time)/1000);if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>4){drag.moved=true;scene.setPointerCapture(e.pointerId);scene.classList.add('dragging');}if(drag.moved){const k=3/Math.min(W,H);yaw+=dx*k;pitch-=dy*k;velocityX=Math.max(-2,Math.min(2,dx*k/dt));velocityY=Math.max(-2,Math.min(2,-dy*k/dt));paint();}drag.lastX=e.clientX;drag.lastY=e.clientY;drag.time=e.timeStamp;});
function endDrag(e){if(!drag||drag.id!==e.pointerId)return;if(drag.moved)suppressUntil=performance.now()+250;if(scene.hasPointerCapture(e.pointerId))scene.releasePointerCapture(e.pointerId);drag=null;scene.classList.remove('dragging');hintDefault();}
scene.addEventListener('pointerup',endDrag);scene.addEventListener('pointercancel',endDrag);
function setPaused(v){paused=v;pause.textContent=v?'继续流动':'暂停流动';pause.setAttribute('aria-pressed',String(v));}
pause.addEventListener('click',()=>setPaused(!paused));foldButton.addEventListener('click',()=>{zoomTarget=zoomTarget>.5?.19:1;if(reduced)zoom=zoomTarget;foldButton.textContent=zoomTarget>.5?'收拢视野':'展开视野';paint();});document.getElementById('reset').addEventListener('click',release);
let resizeFrame=0;new ResizeObserver(()=>{if(scene.clientWidth!==W){cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(layout);}}).observe(scene);layout();setPaused(paused);hintDefault();requestAnimationFrame(tick);
window.__demo={state:()=>({clock,paused,yaw,pitch,zoom,count:spells.filter(d=>d.prepared).length,timers:timers.size,positions:spells.map(d=>({name:names[d.i],x:d.x,y:d.y,z:d.z,scale:d.scale,prepared:d.prepared}))}),seek:(t,z=1)=>{yaw=.35+t*.275;pitch=-.14;zoom=zoomTarget=z;clock=t;paint();},advance,pause:()=>setPaused(true)};
</script></body></html>
